# Build the portfolio image and push it to the GitHub Container Registry (ghcr.io).
# The deploy stack (docker/docker-compose.deploy.yml) pulls this image — the VM never builds.
#
# Triggers: push a version tag (`git tag v1.0.0 && git push --tags`) or run it by hand from the
# Actions tab (workflow_dispatch). Auth uses the automatic GITHUB_TOKEN — no secrets to configure.
# The pushed package starts private; make it public (or `docker login ghcr.io` on the VM) to pull it.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/rad710/portfolio # owner must be lowercase for GHCR

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 → tags 1.2.3 + v1.2.3; short SHA on every run; `latest` on tag/dispatch.
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
