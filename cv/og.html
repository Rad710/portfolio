<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #1c1a17;
        color: #f0ebe3;
        font-family: Georgia, "Times New Roman", serif;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
      }
      .glow {
        position: absolute;
        top: -160px; left: -120px;
        width: 460px; height: 460px;
        border-radius: 50%;
        background: rgba(224, 164, 75, 0.16);
        filter: blur(90px);
      }
      .eyebrow {
        font-family: "Courier New", monospace;
        font-size: 20px;
        letter-spacing: 5px;
        text-transform: uppercase;
        color: #e0a44b;
      }
      h1 {
        font-size: 86px;
        line-height: 1.02;
        font-weight: normal;
        margin-top: 26px;
        max-width: 900px;
      }
      .tagline {
        font-size: 30px;
        color: #b9b0a2;
        margin-top: 24px;
        max-width: 820px;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: "Courier New", monospace;
        font-size: 22px;
        color: #8a8175;
      }
      .footer .name { color: #f0ebe3; }
      .dot { color: #e0a44b; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div>
      <div class="eyebrow">Full-stack engineer</div>
      <h1>I build software that hospitals run on.</h1>
      <div class="tagline">
        React · TypeScript · Java · Python · self-hosted infrastructure &amp; applied AI
      </div>
    </div>
    <div class="footer">
      <span class="name">Rolando Medina Rosner<span class="dot">.</span></span>
      <span>rad710.com</span>
    </div>
  </body>
</html>
